<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>
<body id="createCollection">
    <nav class="bg-slate-400 border-gray-900 h-16">
        <a href="/home" class="text-white underline p-3" id="home">Home</a>
        <a href="/search" class="text-white underline p-3" id="search">Search</a>
        <a href="/authors" class="text-white underline p-3" id="authors">Authors</a>
        <a href="/mycollections" class="text-white underline p-3" id="mycollections">My collections</a>
    </nav>
        <div class="multiselect">
        <label for="collectionName" class="m-3">Name:</label>
        <input type="text" name="collectionName" id="collectionName" class="outline outline-slate-950 rounded-md m-3"/><br /><br />
        <div>
        <label for="shareCollection" class="m-3">Share collection:</label>
        <select name="shareCollection" id="shareCollection" class="outline outline-slate-800 mr-5">
            <option value="select" selected disabled>Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
        <button id="dropdownToggle"
            class="w-44 bg-white border border-gray-300 rounded-md px-4 py-2 text-left shadow-sm hover:border-gray-400">
            Share With
        </button>
       
        <div id="dropdownMenu"
            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-md hidden max-h-40 overflow-y-auto">
        </div>
        </div>
    <button type="button" id="createCollectionBtn" class="bg-black border-4 rounded-full p-2 text-white font-bold m-3">Create
        Collection</button>
</div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="/recipe.js"></script>
</html>
