<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>
<body id="share-recipe">
    <nav class="bg-slate-400 border-gray-900 h-16 p-3">
        <a href="/home" class="text-white underline p-3" id="home">Home</a>
        <a href="/profile" class="text-white underline" id="profile">My account</a>
    </nav>
    <div class="title">
        <h2 class="max-w-md mx-auto my-12 mb-4">Post a Recipe</h2>
    </div>
    <div class="max-w-md mx-auto">
        <form action="/share-recipe" method="post" class="bg-white p-8 rounded-lg" id="shareRecipe-form">
        <label for="recipeName">Recipe Name (*)</label><br />
        <input type="text" name="recipeName" id="recipeName" class="outline outline-slate-950 px-4 py-2 mb-4">
        <br>
        <label for="recipeDescription">Recipe Description</label>
        <textarea name="recipeDescription" id="recipeDescription" rows="2" cols="50" class="outline outline-slate-950 px-4 py-2 mb-4">
            </textarea>
        <br>
        <label for="recipeIngredients">Recipe Ingredients</label><br />
        <textarea name="recipeIngredients" id="recipeIngredients" class="outline outline-slate-950 px-4 py-2 mb-4" rows="4" cols="50">
        </textarea>

        <label for="recipeMethod">Method(*)</label> <br/>
        <textarea name="recipeMethod" id="recipeMethod" class="outline outline-slate-950 px-4 py-2 mb-4" rows="4" cols="60">
        </textarea>
        
        <div class="flex items-center">
        <div class="flex flex-col">
        <label for="cuisine">Cuisine(*)</label>
        <select name="cuisine" id="cuisine" class="outline outline-slate-950 m-3">
            <option value="pleaseSelect">Please Select</option>
            <option value="General">General</option>
            <option value="African">African</option>
            <option value="American">American</option>
            <option value="Australian">Australian</option>
            <option value="British">British</option>
            <option value="Bengali">Bengali</option>
            <option value="Chinese">Chinese</option>
            <option value="European">European</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Indian">Indian</option>
            <option value="Uncategorized">Uncategorized</option>
        </select>
    </div>
        <div class="flex flex-col">
        <label for="cuisine-category">Category(*)</label>
        <select name="cuisine-category" id="cuisine-category" class="outline outline-slate-950 m-4">
            <optgroup label="General">
                <option value="Please Select">Please Select</option>
                <option value="CakesBiscuits">Cakes/Biscuits</option>
                <option value="Desserts">Desserts</option>
                <option value="HotCold Drinks">Hot/Cold Drinks</option>
                <option value="Icecream">Icecream</option>
                <option value="Juice">Juice</option>
                <option value="Salads">Salads</option>
            </optgroup>
            <optgroup label="Other Cuisines">
                <option value="starters">Starters</option>
                <option value="Main Course">Main Course</option>
                <option value="Sides">Sides</option>
            </optgroup>
        </select>
        </div>
        </div>
        
        <div class="flex flex-col">
        <label for="main-ingredients">Main Ingredients(**)</label><br />
        <select name="main-ingredients" id="main-ingredients" class="outline outline-slate-950 px-4 py-2 mb-4" multiple>
            <option value="Please Select">Please Select</option>
            <option value="Wheat">Wheat</option>
            <option value="Rice">Rice</option>
            <option value="Beans/Pulses">Beans/Pulses</option>
            <option value="Cheese/Paneer/Tofu">Cheese/Paneer/Tofu</option>
            <option value="Egg">Egg</option>
            <option value="Dairy">Dairy</option>
            <option value="Flour">Flour</option>
            <option value="Fruits">Fruits</option>
            <option value="Grains">Grains</option>
            <option value="Pasta">Pasta</option>
            <option value="Vegetables">Vegetables</option>
        </select>
        </div>

        <div class="flex flex-col">
        <label for="recipe-type">Recipe Type(**)</label><br />
        <select name="recipe-type" id="recipe-type" class="outline outline-slate-950 px-4 py-2 mb-4" multiple>
            <option value="Please Select">Please Select</option>
            <option value="Baking">Baking</option>
            <option value="Beverages">Beverages</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Bread">Bread</option>
            <option value="Desserts">Desserts</option>
            <option value="Dinner">Dinner</option>
            <option value="Lunch">Lunch</option>
            <option value="Quick Meal">Quick Meal</option>
            <option value="Snacks">Snacks</option>
            <option value="Special Occassion">Special Occassion</option>
        </select>
        </div>

        <label for="cooking-time">Cooking Time(#)</label>
        <select name="cooking-time" id="cooking-time"  class="outline outline-slate-950 px-4 py-2 mb-4">
            <option value="Please Select">Please Select</option>
            <optgroup label="Minutes">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">10-15</option>
                <option value="20">15-20</option>
                <option value="30">20-30</option>
                <option value="45">30-45</option>
                <option value="60">45-60</option>
            </optgroup>
            <optgroup label="Hours">
                <option value="1">1-1 1/2</option>
                <option value="2">1 1/2-2</option>
                <option value="3">2-3</option>
                <option value="4">3-4</option>
                <option value="5">4-5</option>
            </optgroup>
        </select>

        <div class="flex flex-col">
        <label for="marination-time">Marination Time(#)</label>
        <select name="marination-time" id="marination-time" class="outline outline-slate-950 px-4 py-2 mb-4">
            <option value="Please Select">Please Select</option>
            <option value="20">10-20 mins</option>
            <option value="30">20-30 mins</option>
            <option value="1">30-1 hr</option>
            <option value="2">1-2 hrs</option>
            <option value="3">2-3 hrs</option>
            <option value="4">3-4 hrs</option>
            <option value="Overnight">Overnight</option>
        </select>
        </div>
        <label for="serves" class="mx-3">Serves</label>
        <input type="number" name="serves" id="serves" placeholder="Between 1 to 50" class="outline outline-slate-950 px-4 py-2 mb-4">
        <div class="flex-col">
        <label for="files" class="m-4">Image</label>
        <input type="file" name="files" id="fileInput" multiple />
        </div>
       <button type="submit" id="publishRecipe" class="bg-black text-white border-4 p-2 rounded-lg mx-36 mb-5">Publish</button>
        <p class="font-bold text-red-600">* - Required Fields , ** - Either Main Ingredient/Recipe Type should be entered.# - Either cooking time / preparation
        time should be entered.</p>
        
            </form>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="recipe.js"></script>
</html>
