<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/output.css">
</head>
<body id="adminCredsPage">
    <div class="bg-slate-300 rounded-lg p-6 max-w-md mx-auto relative mt-28 shadow-2xl" id="adminCreds">
        <h4>Please create your admin credentials</h4>
        <form id="adminCreds-form" action="#">
            <div class="admin-email m-5">
            <label for="email" class="text-black font-semibold m-4">Email</label>
            <input type="email" name="email" id="email" class=" bg-white border border-gray-600 rounded-md h-10 shadow-lg">
            </div>
            <div class="admin-password m-5">
            <label for="password" class="text-black font-semibold">Password</label>
            <input type="password" name="password" id="password" class=" bg-white border border-gray-600 rounded-md h-10 shadow-lg">
            </div>
            <button type="submit" id="createBtn" class="bg-slate-800 text-white p-2 m-4 rounded-md shadow-xl">Create</button>
        </form>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script type="module" src="/script.js" defer></script>
<script src="/admin.js" defer></script>
</html>
