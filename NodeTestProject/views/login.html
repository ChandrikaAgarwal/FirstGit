<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <div class="max-w-md mx-auto relative flex flex-col my-10 p-4 rounded-md text-black bg-white">
        <div class="text-2xl font-bold mb-2 text-[#1e0e4b] text-center">Welcome back to <span
                class="text-[#7747ff]">App</span></div>
        <div class="text-sm font-normal mb-4 text-center text-[#1e0e4b]">Log in to your account</div>
        <form class="flex flex-col gap-3" method="post" action="/users" id="login-form">
            <div class="block relative">
                <label for="email"
                    class="block text-gray-600 cursor-text text-sm leading-[140%] font-normal mb-2">Email</label>
                <input type="email" id="email"
                    class="rounded border border-gray-200 text-sm w-full font-normal leading-[18px] text-black tracking-[0px] appearance-none block h-11 m-0 p-[11px] focus:ring-2 ring-offset-2  ring-gray-900 outline-0">

            </div>
            <div class="block relative">
                <label for="password"
                    class="block text-gray-600 cursor-text text-sm leading-[140%] font-normal mb-2">Password</label>
                <input type="password" id="password"
                    class="rounded border border-gray-200 text-sm w-full font-normal leading-[18px] text-black tracking-[0px] appearance-none block h-11 m-0 p-[11px] focus:ring-2 ring-offset-2 ring-gray-900 outline-0">

            </div>
            
            <div class="flex flex-row">
            <label for="button" class="text-[#7747ff]">Login As:</label>
            <button type="button" name="role" value="admin"
                class="admin-login bg-[#7747ff] w-max m-auto px-6 py-2 rounded text-white text-sm font-normal ">Admin</button>
            <button type="button" name="role" value="user"
                    class="user-login bg-[#7747ff] w-max m-auto px-6 py-2 rounded text-white text-sm font-normal">User</button>

        </div>
        </form>
        <div class="text-sm text-center mt-[1.6rem]">Don’t have an account yet? <a class="text-sm text-[#7747ff]"
                href="/">Sign up for free!</a></div>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script type="module" src="script.js"></script>

</html>
