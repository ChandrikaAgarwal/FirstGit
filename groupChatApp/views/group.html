<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body id="groupBody">
    <div class="flexibleNavbar fixed top-0 left-0 h-screen w-40 flex-1 flex-col bg-slate-500 text-white shadow-lg">
        <ul class="usersloggedIngroup">
        </ul>
        <button
            class="logoutBtn fixed bottom-4 flex bg-red-950 text-red-400 border border-red-400 border-b-4 font-medium overflow-hidden mx-5 px-5 py-2 rounded-md hover:brightness-150 hover:border-t-4 hover:border-b active:opacity-75 outline-none duration-300 group">
            <span
                class="bg-red-400 shadow-red-400 absolute -top-[150%] left-0 inline-flex w-80 h-[5px] rounded-md opacity-50 group-hover:top-[150%] duration-500 shadow-[0_0_10px_10px_rgba(0,0,0,0.3)]"></span>
            LogOut
        </button>

    </div>
    <form id="addParticipants-form" class="flex gap-2 mx-44 my-3">
    <input type="text" id="search" placeholder=" add participants..." class="h-11 px-2 my-3 border border-gray-300 rounded-md" oninput="handleLiveSearch()">
    <button type="button" id="addMembers" class="bg-slate-800 text-white p-2 my-3 rounded-md">Add</button>
    <button type="button" id="deleteMembers" class="bg-slate-800 text-white p-2 my-3 rounded-md">Remove</button>
    </form>
    <ul id="searchResults"></ul>
    <div class="max-w-sm mx-auto relative top-3 text-center">
        <h1>Chat App</h1>
        <div class="overscroll-y-auto md:overscroll-contain">
            <ul class="groupmessages"></ul>
        </div>
        <form class="fixed bottom-20 left-44" id="fileUploadForm" enctype="multipart/form-data" method="post">
        <input type="file" name="files" id="fileInput" multiple/>
        <button id="sendFileBtn" type="submit" class="bg-black text-white border-4 rounded-lg p-1 mx-0">Send File</button>
        </form>
        <div class="fixed bottom-0 left-32 w-full bg-blue-900 p-3 mx-8">
            <form action="/" method="post" id="group-msg-form">
                <input class="rounded-lg border-4 mr-2 border-blue-400 w-96 h-10" type="text" name="message"
                    id="message" placeholder=" Type tour message here" />
                
                <button type="submit" id="sendMsg"
                    class="cursor-pointer transition-all 
    bg-gray-700 text-white px-6 py-2 rounded-lg
    border-green-400
    border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px]
    active:border-b-[2px] active:brightness-90 active:translate-y-[2px] hover:shadow-xl hover:shadow-green-300 shadow-green-300 active:shadow-none">
                    Send
                </button>
            </form>
        </div>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="/groupScript.js"></script>
</html>
