<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tailwind Multi-Select</title>
   <link rel="stylesheet" href="output.css">
   
</head>

<body class="relative flex items-center justify-center h-screen bg-gray-100" id="createGroup">
    <div class="relative w-64 space-y-4" id="multiSelect">
        <div class="bg-slate-700">
        <a href="/chat" class="fixed content-start top-0 left-0 mx-5 py-2 text-blue-700 bg-slate-700 font-semibold hover:underline">Home</a>
        </div>
        <button id="dropdownToggle"
            class="w-full bg-white border border-gray-300 rounded-md px-4 py-2 text-left shadow-sm hover:border-gray-400">
            Select options
        </button>

        <div id="dropdownMenu"
            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-md hidden max-h-40 overflow-y-auto">
        </div>
    <!-- </div> -->
    
    <button type="button" id="createGrpBtn" class="bg-blue-700 border-4 rounded-full p-2 text-white font-bold">Create Group</button> <br>
    <div class="bg-slate-300 rounded-md p-6 hidden" id="group_nameForm">
    <form id="newgrp-form">
        <label for="groupName" class="text-black font-semibold">Enter group Name</label>
      <input type="text" name="groupName" id="groupName" class=" bg-white border border-gray-600 rounded-md h-10">
      <button type="submit" id="createBtn" class="bg-slate-800 text-white p-2 my-3 rounded-md">Create</button>
    </form>
    </div>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="script.js"></script>
</html>
