<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
</head>
<body>
    <div class="container">
        <form id="resetPassword">
            <label for="password">New password</label>
            <input type="password" name="password" id="newPassword">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" name="confirmPassword" id="confirmPassword">
            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        const token = localStorage.getItem("token");
        const api_url = "http://15.206.27.247";
        const form = document.getElementById('resetPassword');
        const urlParams = window.location.pathname.split('/')
        const requestId = urlParams[urlParams.length - 1];
        if (requestId) {
            console.log("Extracted requestId:", requestId);
            checkStatus(requestId)
        } else {
            console.log("INVALID Request ID");
        }

        async function checkStatus(reqId) {
            try {
                const getReqStatus = await fetch(`${api_url}/password/resetpassword/${reqId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                })
                console.log("Request Status: ", getReqStatus);
                const data = await getReqStatus.json()
                console.log("request staus data: ", data);
                if(!data.active || !data.details){
                    alert("Link is no longer active");
                    form.style.display="none"
                }
            } catch (err) {
                console.log("error fetching request status: ", err);
            }
        }

        form.addEventListener("submit", async(e)=>{
            e.preventDefault();
            try {
                const toresetPassword={
                newPassword:document.getElementById("newPassword").value,  
                confirmPassword: document.getElementById("confirmPassword").value  
            }
                if(toresetPassword.newPassword!==toresetPassword.confirmPassword){
                    alert("Passwords do not match")
                    return;
                }
                const resetPassword = await fetch(`${api_url}/password/updatepassword/${requestId}`,{
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(toresetPassword)
                })
                console.log("Password Reset Response: ", resetPassword);
                const data = await resetPassword.json()
                console.log("reset password response data: ", data);
                window.location.href=`/users`
            }catch(err){
                console.log("error resetting password: ", err);
            }
        })
    </script>
</body>

</html>
