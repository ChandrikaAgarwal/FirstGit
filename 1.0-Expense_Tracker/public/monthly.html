<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary " data-bs-theme="dark">

        <a class="navbar-brand" href="http://localhost:5000/expenses">
            <img src="expense tracker logo-resized.png" alt=""> <sup class="daytodayexpenses"> Day to Day Expenses</sup>
        </a>
        <button type="button" class="premium_member">Buy Premium Membership</button>
        <ul class="nav nav-underline ">
            <li class="nav-item daily "><a class="flex-sm-fill text-sm-center nav-link" href="/expenses">Daily</a>
            </li>
            <li class="nav-item monthly"><a class="flex-sm-fill text-sm-center nav-link active"
                    href="/monthly">Monthly</a></li>
            <li class="nav-item weekly"><a class="flex-sm-fill text-sm-center nav-link " href="/weekly">Weekly</a></li>
            <li class="nav-item leaderBoard"><a class="flex-sm-fill text-sm-center nav-link " href="/premium">LeaderBoard</a></li>
        </ul>
    </nav>

    <div class="container slider">
        <div id="myslideshow" class="carousel slide" data-bs-ride="false">
            <div class="carousel-inner">
                <div class="carousel-item active" id="monthDisplay">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myslideshow" data-bs-slide="prev"
                id="prevbtn">
                <span class="carousel-control-prev-icon p-3 rounded-circle" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#myslideshow" data-bs-slide="next"
                id="nextbtn">
                <span class="carousel-control-next-icon p-3 rounded-circle" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div><br /><br />
        <div class="monthlyOverView">
            <div class="row total">
                <div class="col totalIncome">
                    <h5 class="text-center" style="font-weight: bold;">Total Income (Credit)</h5>
                </div>
                <div class="col totalExpense">
                    <h5 class="text-center" style="font-weight: bold;">Total Expense (Debit)</h5>
                </div>
            </div>
            <div class="row totalDisplay">
                <div class="col totalIncomeDisplay">
                </div>
                <div class="col totalExpenseDisplay">
                </div>
            </div>
            <div class="row balance">
                <div class="col c/f">
                    <h5 class="text-center me-4" style="font-weight: bold;">C/F</h5>
                </div>
                <div class="col totalbalance">
                    <h5 class="text-center" style="font-weight: bold;">Savings</h5>
                </div>
            </div>

            <div class="row displayBalance">
                <div class="col cfDisplay">
                </div>
                <div class="col balanceDisplay">
                </div>
            </div>

        </div><br />
        <div class="display_expenses">
   
<table class="table table-striped table-bordered table-dark" >
    <thead class="thead-dark">
        <tr>
            <th scope="col">DATE</th>
            <th scope="col">DESCRIPTION</th>
            <th scope="col">CATEGORY</th>
            <th scope="col">INCOME</th>
            <th scope="col">EXPENSE</th>
        </tr>
    </thead>
    <tbody class="monthExpenses"></tbody>
</table>
</div>
</div>
</div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<!-- <script src="script.js"></script> -->
<script src="monthly.js"></script>

</html>
